<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starlight Bloom</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            padding: 0;
            background: #06020c;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
            color: #ffeef8;
            cursor: pointer;
            position: relative;
        }

        /* Ambient background fireflies */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                radial-gradient(white, rgba(255,255,255,.2) 1px, transparent 1px),
                radial-gradient(white, rgba(255,255,255,.1) 1px, transparent 2px),
                radial-gradient(white, rgba(255,255,255,.1) 2px, transparent 3px);
            background-size: 550px 550px, 350px 350px, 250px 250px;
            background-position: 0 0, 40px 60px, 130px 270px;
            z-index: -1;
            opacity: 0.3;
        }

        /* The central interaction card */
        .card {
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            padding: 2.5rem;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            max-width: 80%;
            text-align: center;
            z-index: 10;
            transition: transform 0.2s;
            user-select: none;
            -webkit-user-select: none;
        }
        .card:active { transform: scale(0.97); }

        #quote {
            font-size: 1.2rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            text-shadow: 0 0 8px rgba(255, 140, 200, 0.6);
            opacity: 1;
            transition: opacity 0.3s ease-out, transform 0.3s ease-out;
        }

        .fade-out {
            opacity: 0 !important;
            transform: translateY(-5px);
        }

        .hint {
            font-size: 0.8rem;
            opacity: 0.3;
            margin-top: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Star Bloom Animation Style */
        .starlight-bloom {
            position: absolute;
            width: 30px;
            height: 30px;
            pointer-events: none;
            z-index: 5;
            transform-origin: center center;
            mix-blend-mode: screen;
        }

        /* Create a generic simple star shape */
        .starlight-bloom::before, .starlight-bloom::after {
            content: "";
            position: absolute;
            top: 50%; left: 50%;
            background: linear-gradient(135deg, #ffd875, #ff4b8b);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            animation: bloomEffect 1.2s ease-out forwards;
        }

        .starlight-bloom::before { width: 100%; height: 20%; border-radius: 10px; }
        .starlight-bloom::after { width: 20%; height: 100%; border-radius: 10px; }

        @keyframes bloomEffect {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(0deg);
                opacity: 1;
                filter: blur(0px);
            }
            30% {
                transform: translate(-50%, -50%) scale(1.5) rotate(45deg);
                opacity: 0.9;
                filter: blur(1px);
            }
            100% {
                transform: translate(-50%, -50%) scale(3) rotate(90deg);
                opacity: 0;
                filter: blur(4px);
            }
        }
    </style>
</head>
<body>

    <!-- Central Interactive Area -->
    <div class="card" id="interactionCard">
        <p id="quote">Tap anywhere on the screen ✨</p>
        <p class="hint">Made for you</p>
    </div>

    <script>
        const quotes = [
            "Just thought of you ✨",
            "Blooming just for you 🌸",
            "Hope this made you smile :)",
            "Have a wonderful day 💖",
            "Checking in on you!",
            "You are appreciated.",
            "You make things better.",
            "Always nearby if you need me.",
            "Made something special just for you."
        ];
        let quoteIndex = -1; // Start at -1 to handle the first tap correctly
        const card = document.getElementById('interactionCard');
        const quoteText = document.getElementById('quote');

        function createBloom(x, y) {
            const bloom = document.createElement('div');
            bloom.className = 'starlight-bloom';
            
            // Offset position by half the element size to center it on the tap
            bloom.style.left = `${x - 15}px`;
            bloom.style.top = `${y - 15}px`;

            document.body.appendChild(bloom);

            // Clean up the DOM after animation completes
            setTimeout(() => {
                bloom.remove();
            }, 1200);
        }

        // Handle the screen-wide interaction
        document.body.addEventListener('click', (e) => {
            // 1. Create the ambient bloom at the tap location
            createBloom(e.clientX, e.clientY);

            // 2. Animate and update the quote (only on body click, not the card itself)
            if (e.target.closest('#interactionCard')) return;

            quoteIndex = (quoteIndex + 1) % quotes.length;
            
            quoteText.classList.add('fade-out');

            setTimeout(() => {
                quoteText.textContent = quotes[quoteIndex];
                quoteText.classList.remove('fade-out');
            }, 300);
        });

        // Optional: A tap *on the card* still cycles the quotes but feels slightly different
        card.addEventListener('click', () => {
            quoteIndex = (quoteIndex + 1) % quotes.length;
            
            quoteText.classList.add('fade-out');

            setTimeout(() => {
                quoteText.textContent = quotes[quoteIndex];
                quoteText.classList.remove('fade-out');
            }, 300);
        });

    </script>
</body>
</html>
